name: Layev source and CPU gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: source-integrity-and-critical-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Source bytes, license/contract integrity, links, syntax and whitespace formatting
        run: python scripts/check_source.py
      - name: Install pinned linter
        run: python -m pip install ruff==0.13.2
      - name: Critical Python lint (not a whole-tree autoformat claim)
        run: python -m ruff check --select E9,F63,F7,F82 src tests scripts integrations

  model:
    name: model-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.10.0
      - name: Resolve nothing silently; use the repository lock and real Rust tokenizer
        run: uv sync --locked --extra dev --extra native --python '${{ matrix.python }}'
      - name: Assert native tokenizer dependency really loaded
        run: uv run --no-sync python -c "import tokenizers; assert tokenizers.__version__ == '0.22.1'"
      - name: Full source suite with explicit skip reasons
        run: uv run --no-sync python -m pytest -q -rs
      - name: Compile source
        run: uv run --no-sync python -m compileall -q src tests scripts integrations
      - name: 24-configuration FP32 audit
        run: uv run --no-sync python scripts/verify_parallel_numerics.py --out verification-output/numerics.json
      - name: Same-policy resume, fresh calibration and local monitoring exercise
        run: uv run --no-sync python scripts/verify_stage3_local.py --out verification-output/software
      - name: Pin build backend separately from runtime lock
        run: uv pip install --python .venv setuptools==82.0.1
      - name: Wheel and source distribution
        run: uv build --no-build-isolation
      - name: Check wheel content against the tested runtime source
        run: uv run --no-sync python scripts/check_wheel.py --directory dist
      - name: Install built wheel over editable source
        run: uv pip install --python .venv --no-deps --reinstall dist/*.whl
      - name: Installed-wheel import and CLI, outside checkout
        run: |
          uv run --no-sync python scripts/check_wheel.py --directory dist --installed-smoke
      - name: Installed-wheel loopback HTTP and batching
        run: uv run --no-sync python scripts/verify_parallel_http.py --checkpoint verification-output/software/run/calibrated.pt --out verification-output/http
      - name: Schema generation must not drift
        run: |
          uv run --no-sync python scripts/export_schemas.py
          git diff --exit-code -- schemas
