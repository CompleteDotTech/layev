[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "kev-laya"
version = "0.1.0+stage3"
description = "Independent shared-prefix decision engine; research candidate, not a validated Jev replacement"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
readme = "README.md"
dependencies = ["torch>=2.6,<2.11", "pydantic>=2.9,<3", "fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.30,<1", "safetensors>=0.4,<1"]
[project.optional-dependencies]
monitoring = ["psutil>=7,<8"]
native = ["tokenizers==0.22.1"]
reference = ["transformers==4.57.1"]
dev = ["pytest>=9,<10", "jsonschema>=4,<5", "psutil>=7,<8"]
[project.scripts]
kev-laya = "kev_laya.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "integrations/overwatch/added/src"]
markers = ["native: requires pinned pretrained Qwen files", "overwatch: requires the original supported Overwatch environment"]
